<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>보금이의 방 대변신</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 보금이의 방 대변신 — 교과서 96~97쪽 (공간 활용 · 가구 배치 · 정리와 수납) */
:root{
  --bg:#FFF5EA; --card:#FFFFFF; --ink:#33302C; --muted:#6A625A; --line:#3A3A3A;
  --mint:#9FDBC4; --mint-deep:#2F7D5E; --coral:#F28B82; --yellow:#FFD95E;
  --peach:#FCE3CF; --wood-deep:#A9734A; --sky:#CFE3F7; --lav:#E6DAF5; --pink:#FAD3DC;
  --ok:#23885A; --ok-bg:#E3F5EC; --bad:#C8463F; --bad-bg:#FCE9E7;
  --display:'Jua','Gowun Dodum','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--body);font-size:17px;line-height:1.6;
  background-image:radial-gradient(circle at 12% 8%,#FFE7CF 0,transparent 32%),radial-gradient(circle at 92% 30%,#FDE6EC 0,transparent 28%);
  padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:2.2rem;line-height:1.2} h2{font-size:1.55rem;line-height:1.25}
p{margin:0}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 0 rgba(58,58,58,.12)}
.muted{color:var(--muted)}
.tag{display:inline-block;font-family:var(--display);font-size:.95rem;padding:2px 12px;border-radius:999px;border:2px solid var(--line);background:var(--yellow)}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{font-family:var(--display);font-size:1.25rem;padding:12px 22px;border-radius:16px;border:3px solid var(--line);background:var(--mint);box-shadow:0 4px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.sec{background:#fff} .btn.warm{background:var(--yellow)} .btn.small{font-size:1.05rem;padding:8px 14px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid var(--coral);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.who{font-family:var(--display);font-size:1rem;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 14px}
.bogeum{width:120px;height:auto;flex:none}
.say{display:flex;gap:14px;align-items:center}
.bubble{position:relative;background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 16px;font-size:1.05rem}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;width:18px;height:18px;background:#fff;border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.hero{text-align:center;align-items:center;background:linear-gradient(180deg,#FFE9D2,#fff 70%)}
.heroart{width:100%;max-width:440px}
.heroart svg{width:100%;height:auto;border-radius:18px;border:3px solid var(--line);display:block}
.fields{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px;width:100%}
.fields label{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:1rem;text-align:left}
input{font:inherit;font-size:1.1rem;padding:10px 12px;border:3px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%;min-width:0}
/* 미션 목록 */
.missions{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mission{position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;padding:16px;border:3px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--line)}
.mission .num{font-family:var(--display);font-size:.95rem;color:var(--muted)}
.mission .mt{font-family:var(--display);font-size:1.35rem;line-height:1.2}
.mission .mp{font-size:.95rem;color:var(--muted)}
.mission .stars{font-size:1.2rem;letter-spacing:2px;color:#E0A100;min-height:1.4em}
.mission.done::after{content:"완료";position:absolute;right:12px;top:12px;font-family:var(--display);font-size:.95rem;background:var(--ok);color:#fff;border-radius:999px;padding:2px 10px;transform:rotate(6deg)}
.mission.locked{opacity:.5;box-shadow:none}
.m1{background:var(--pink)} .m2{background:var(--peach)} .m3{background:var(--sky)} .m4{background:var(--lav)}
.steps{display:flex;gap:6px} .steps span{flex:1;height:8px;border-radius:99px;background:#EADCCB} .steps span.on{background:var(--wood-deep)}
/* 미션1 */
.defs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.def{border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:.98rem;line-height:1.45}
.def b{font-family:var(--display);font-weight:400;font-size:1.1rem;display:block}
.def.a{background:var(--pink)} .def.b{background:#FFF1BF}
.scard{display:flex;flex-direction:column;gap:12px;background:#FFFCF7;border:3px solid var(--line);border-radius:20px;padding:14px}
.scard svg{width:100%;max-width:460px;margin:0 auto;height:auto;border-radius:14px;border:2px solid var(--line);display:block}
.scard .txt{font-size:1.2rem;font-weight:700;line-height:1.5}
.choice2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice2 .btn{font-size:1.3rem;padding:16px 10px}
.choice2 .btn.a{background:var(--pink)} .choice2 .btn.b{background:#FFF1BF}
.combo{font-family:var(--display);font-size:1rem;padding:2px 12px;border-radius:999px;border:2px solid var(--line);background:#fff}
.combo.hot{background:linear-gradient(90deg,#FFD95E,#F28B82);color:#3A2A00;animation:pop .35s}
.fb{border-radius:14px;padding:12px 14px;font-size:1.02rem;line-height:1.5;border:2px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb b{font-family:var(--display);font-weight:400;font-size:1.15rem}
/* 방 */
.m2grid{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:16px;align-items:start}
.roomwrap{--p:16px;position:relative;padding:var(--p);background:linear-gradient(135deg,#7A685A,#5E4F44);border-radius:12px;width:100%;max-width:540px;margin:0 auto;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.floor{position:relative;display:grid;overflow:hidden;
  background-color:#F1DCBD;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 46px),repeating-linear-gradient(0deg,transparent 0 30px,rgba(150,105,60,.16) 30px 32px)}
.light{position:absolute;pointer-events:none}
.cell{border:1px dashed rgba(120,90,60,.22);background:transparent;padding:0;margin:0}
.cell.swing{background:rgba(242,139,130,.13)}
.cell.hit{background:rgba(200,70,63,.35)!important}
.overlay{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.piece{position:absolute;padding:3px;border:none;background:none}
.piece svg{width:100%;height:100%;display:block;overflow:visible}
.piece.sel svg{outline:4px solid var(--coral);outline-offset:1px;border-radius:8px}
.piece.bad svg{outline:4px solid var(--bad);outline-offset:1px;border-radius:8px;animation:shake .4s}
.piece.fixed::after{content:"✓";position:absolute;right:-4px;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;font-size:.9rem;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.wallmark{position:absolute;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:.72rem;line-height:1;overflow:hidden;pointer-events:none}
.wm-win{background:linear-gradient(90deg,#BFE3F7,#86C6EA);border:2px solid #fff;color:#1F4E6B}
.wm-door{background:#F1DCBD;color:#8C5B36}
.wm-sw{background:#FFD95E;color:#3A3A3A;border:2px solid #fff}
.wm-out{background:#fff;color:#3A3A3A;border:2px solid #FFD95E}
.tray{display:flex;flex-direction:column;gap:10px}
.titem{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 10px;border:3px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--line)}
.titem svg{width:58px;height:46px;flex:none}
.titem .tn{font-family:var(--display);font-size:1.1rem;line-height:1.1}
.titem .ts{font-size:.82rem;color:var(--muted);line-height:1.3}
.titem.sel{background:var(--yellow)}
.titem.used{opacity:.4;box-shadow:none}
.mini{display:inline-block;font-size:.75rem;font-family:var(--display);padding:0 6px;border-radius:6px;border:1.5px solid var(--line);margin-right:3px}
.mini.tall{background:#D9E8F7}
.rules{display:flex;flex-direction:column;gap:8px}
.rule{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:.98rem;line-height:1.4}
.rule .ic{font-family:var(--display);flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);background:#fff;font-size:.9rem}
.rule.ok{background:var(--ok-bg);border-color:var(--ok)} .rule.ok .ic{background:var(--ok);color:#fff;border-color:var(--ok)}
.rule.no{background:var(--bad-bg);border-color:var(--bad)} .rule.no .ic{background:var(--bad);color:#fff;border-color:var(--bad)}
.rule small{display:block;color:var(--muted);font-size:.88rem}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
/* 선반 */
.m3grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.shelfwrap{display:flex;gap:8px;align-items:stretch}
.shelf{flex:1;display:flex;flex-direction:column;border:5px solid #9A6640;border-radius:12px;background:linear-gradient(180deg,#E9C79C,#D6A877);padding:5px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 5px 0 rgba(0,0,0,.15)}
.lvl{position:relative;min-height:92px;border:none;border-bottom:8px solid #9A6640;background:linear-gradient(180deg,#F7E7D2,#FBF2E6 40%,#F3E0C8);text-align:left;padding:6px 8px;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 6px 8px -6px rgba(90,60,30,.35)}
.lvl:last-child{border-bottom:none}
.lvl .ln{font-family:var(--display);font-size:.95rem;color:var(--muted)}
.lvl .lt{font-family:var(--display);font-size:1rem;color:var(--ok)}
.lvl .itemrow{display:flex;gap:2px;flex-wrap:wrap;align-items:flex-end}
.lvl .itemrow svg{width:46px;height:46px}
.lvl .itemrow button{border:none;background:none;padding:0;position:relative}
.lvl .itemrow button.fixed::after{content:"✓";position:absolute;right:-2px;top:-4px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.lvl.wrong{animation:shake .4s;background:var(--bad-bg)}
.ruler{width:74px;flex:none;display:flex;flex-direction:column;font-size:.78rem;line-height:1.25;text-align:center;color:var(--muted);font-family:var(--display)}
.ruler div{flex:1;display:flex;align-items:center;justify-content:center;border-left:3px dotted #C9B49A}
.ruler .reach{border-left:3px solid var(--coral);color:var(--bad)}
.item{display:flex;gap:14px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:20px;padding:14px}
.item svg{width:104px;height:104px;flex:none}
.item .iname{font-family:var(--display);font-size:1.45rem;line-height:1.2}
.item .isit{font-size:1.06rem;line-height:1.55}
/* 보스 */
.meter{height:22px;border:3px solid var(--line);border-radius:999px;background:#fff;overflow:hidden}
.meter span{display:block;height:100%;background:linear-gradient(90deg,#9FDBC4,#2F7D5E);transition:width .5s}
.bossgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:12px 14px;border:3px solid var(--line);border-radius:14px;background:#fff;font-size:1.05rem;line-height:1.45}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);opacity:.7}
.pick3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick3 button{display:flex;flex-direction:column;gap:6px;padding:8px;border:3px solid var(--line);border-radius:16px;background:#fff;text-align:center;font-family:var(--display);font-size:1rem;line-height:1.25}
.pick3 button svg{width:100%;height:auto;border-radius:10px;border:2px solid var(--line)}
.pick3 button.wrong{background:var(--bad-bg);border-color:var(--bad);opacity:.7}
/* 리포트 */
.report{text-align:center;align-items:center;background:#FFFDF6;border-width:5px;border-style:double;padding:28px 22px}
.report .big{font-family:var(--display);font-size:3.2rem;color:var(--wood-deep);line-height:1}
.report table{border-collapse:collapse;font-size:1.05rem}
.report td{padding:4px 12px;border-bottom:1px dashed #CBB}
.report td:first-child{text-align:left} .report td:last-child{text-align:right;font-family:var(--display);color:#C98A00}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:1.02rem;max-width:min(92vw,560px);text-align:center;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.modalbg{position:fixed;inset:0;background:rgba(40,30,20,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40;overflow:auto}
.modal{max-width:500px;width:100%;margin:auto}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:700px){
  .missions,.defs,.m3grid,.bossgrid,.m2grid{grid-template-columns:1fr}
  .tray{flex-direction:row;flex-wrap:wrap} .titem{flex:1 1 45%}
  .fields{grid-template-columns:1fr 1fr} .fields label:last-child{grid-column:1/-1}
  .bogeum{width:88px} .pick3{grid-template-columns:1fr}
}
</style></head><body>

<script>
/* ===== 선생님이 바꿀 수 있는 값 ===== */
const RESET_CODE = "9876";   // 선생님 전용 기기 초기화 코드 (반이 바뀔 때)

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let S = load();
function fresh(){ return {who:null, start:null, m:{1:null,2:null,3:null,4:null}, challenge:false, boss:null, end:null}; }
function load(){ try{ const v = JSON.parse(localStorage.getItem(KEY)); if(v && v.m) return v; }catch(e){} return fresh(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'), ms); }
function starStr(n){ return '★'.repeat(n) + '☆'.repeat(3-n); }
function eul(w){ const c=w.charCodeAt(w.length-1)-0xAC00; return (c>=0&&c<11172&&c%28)?'을':'를'; }
function eun(w){ const c=w.charCodeAt(w.length-1)-0xAC00; return (c>=0&&c<11172&&c%28)?'은':'는'; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function say(html, small){ return `<div class="say"><img class="bogeum" src="${BOGEUM}" alt="보금이"${small?' style="width:84px"':''}><div class="bubble">${html}</div></div>`; }
function topbar(title){
  return `<div class="top"><button class="btn sec small" onclick="go('home')">← 미션 목록</button><span class="disp" style="font-size:1.25rem">${title}</span><span class="who">${esc(S.who.cls)}반 ${esc(S.who.no)}번 ${esc(S.who.name)}</span></div>`;
}
let view = 'home';
function go(v){ view = v; closeModal(); const t=$('#toast'); if(t) t.classList.remove('on'); render(); window.scrollTo(0,0); }

function scene(inner){
  const fy = 108;
  let planks=''; for(let x=0;x<230;x+=34) planks+=`<line x1="${x}" y1="${fy}" x2="${x-14}" y2="150" stroke="#9A6A3E" stroke-opacity=".18" stroke-width="2"/>`;
  return `<svg viewBox="0 0 200 150" role="img"><rect width="200" height="${fy}" fill="url(#gWall)"/>
   <rect y="${fy}" width="200" height="${150-fy}" fill="url(#gFloor)"/>${planks}
   <rect y="${fy-5}" width="200" height="6" fill="#E8D2B6"/><line x1="0" y1="${fy+1}" x2="200" y2="${fy+1}" stroke="#4A3B32" stroke-opacity=".35" stroke-width="2"/>
   ${inner}</svg>`;
}

    for(let i=1;i<n;i++) g += vert?`<line x1="14" y1="${i*100}" x2="${W-14}" y2="${i*100}" ${O2}/>`:`<line x1="${i*100}" y1="14" x2="${i*100}" y2="${H-14}" ${O2}/>`;
    for(let i=0;i<n;i++) g += vert?`<circle cx="${W/2}" cy="${i*100+50}" r="6" fill="url(#gYellow)" ${O2}/>`:`<circle cx="${i*100+50}" cy="${H/2}" r="6" fill="url(#gYellow)" ${O2}/>`;
  } else if(type==='desk'){
    g += `<rect x="6" y="6" width="${W-12}" height="${H-12}" rx="10" fill="url(#gWood)" ${O}/><rect x="6" y="6" width="${W-12}" height="${H-12}" rx="10" fill="url(#pGrain)"/>`;
    const cx=W/2, cy=H/2;
    if(vert) g += `<circle cx="${cx}" cy="${cy+52}" r="30" fill="url(#gLamp)"/><rect x="${cx-26}" y="${cy-66}" width="52" height="70" rx="6" fill="url(#gGray)" ${O}/><rect x="${cx-19}" y="${cy-59}" width="38" height="50" rx="3" fill="url(#gSky)"/><circle cx="${cx}" cy="${cy+52}" r="13" fill="url(#gYellow)" ${O}/><rect x="${cx+14}" y="${cy+14}" width="14" height="14" rx="4" fill="url(#gCoral)" ${O2}/>`;
    else g += `<circle cx="${cx+52}" cy="${cy}" r="30" fill="url(#gLamp)"/><rect x="${cx-66}" y="${cy-26}" width="70" height="52" rx="6" fill="url(#gGray)" ${O}/><rect x="${cx-59}" y="${cy-19}" width="50" height="38" rx="3" fill="url(#gSky)"/><circle cx="${cx+52}" cy="${cy}" r="13" fill="url(#gYellow)" ${O}/><rect x="${cx+12}" y="${cy+12}" width="14" height="14" rx="4" fill="url(#gCoral)" ${O2}/>`;
  } else if(type==='shelf'){
    g += `<rect x="5" y="5" width="${W-10}" height="${H-10}" rx="6" fill="url(#gWoodD)" ${O}/>`;
    const cols=['url(#gCoral)','url(#gSky)','url(#gYellow)','url(#gMint)','url(#gLav)','url(#gPink)'];
    const n=Math.max(w,h)*5;
    for(let i=0;i<n;i++){ const c=cols[(i*7)%cols.length]; const jit=(i%3)*4;
      if(vert) g += `<rect x="${16+jit}" y="${(15+i*((H-30)/n)).toFixed(1)}" width="${W-32-jit}" height="${((H-30)/n-3).toFixed(1)}" rx="2" fill="${c}" ${O2}/>`;
      else g += `<rect x="${(15+i*((W-30)/n)).toFixed(1)}" y="${16+jit}" width="${((W-30)/n-3).toFixed(1)}" height="${H-32-jit}" rx="2" fill="${c}" ${O2}/>`; }
  } else if(type==='drawer'){
    g += `<rect x="8" y="8" width="${W-16}" height="${H-16}" rx="12" fill="url(#gWood)" ${O}/><rect x="8" y="8" width="${W-16}" height="${H-16}" rx="12" fill="url(#pGrain)"/>`;
    g += `<circle cx="50" cy="50" r="22" fill="url(#gMint)" ${O}/><path d="M50 50 q-16 -8 -12 -24 M50 50 q14 -10 16 -22 M50 50 q-2 -16 4 -26" fill="none" stroke="#2F7D5E" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="8" fill="url(#gCoral)" ${O2}/>`;
  }
  return `<svg viewBox="-4 -4 ${W+8} ${H+8}" preserveAspectRatio="none"><g filter="url(#fSh)">${g}</g></svg>`;
}

/* ================= 방 공통 (배치 퍼즐 · 최종 보스) ================= */
const FDEF = {
 bed:   {name:'침대', w:2,h:4, big:true,  tall:false, front:false, sub:'꼭 필요하고 부피가 큼'},
 ward:  {name:'옷장', w:3,h:1, big:true,  tall:true,  front:true,  sub:'키 큼 · 문 열 자리 필요'},
 desk:  {name:'책상', w:2,h:1, big:false, tall:false, front:true,  sub:'의자를 뺄 자리 필요'},
 shelf: {name:'책장', w:2,h:1, big:false, tall:true,  front:false, sub:'키가 큰 가구'},
 drawer:{name:'협탁', w:1,h:1, big:false, tall:false, front:false, sub:'침대 옆에 두는 작은 서랍장'}
};
function mkCfg(c){
  const wc=(side,a,n)=>{const o=[];for(let i=0;i<n;i++){ if(side==='left')o.push([0,a+i]); if(side==='right')o.push([c.cols-1,a+i]); if(side==='top')o.push([a+i,0]); if(side==='bottom')o.push([a+i,c.rows-1]); } return o;};
  c.WIN=wc(c.window.side,c.window.a,c.window.n);
  c.SW=wc(c.sw.side,c.sw.a,1)[0]; c.OUT=wc(c.out.side,c.out.a,1)[0];
  const a=c.door.a;
  c.SWING = c.door.side==='bottom'?[[a,c.rows-1],[a+1,c.rows-1],[a,c.rows-2],[a+1,c.rows-2]]:[[a,0],[a+1,0],[a,1],[a+1,1]];
  return c;
}
const ROOM1 = mkCfg({cols:6,rows:6, window:{side:'left',a:1,n:3}, door:{side:'bottom',a:4}, sw:{side:'bottom',a:3}, out:{side:'right',a:1}, furn:['desk','shelf','bed','ward']});
const ROOM2 = mkCfg({cols:6,rows:5, window:{side:'bottom',a:2,n:3}, door:{side:'top',a:0}, sw:{side:'top',a:2}, out:{side:'right',a:0}, furn:['drawer','desk','shelf','bed','ward']});
const key = c => c[0]+','+c[1];
function cellsOf(p){ const out=[]; for(let y=0;y<p.h;y++) for(let x=0;x<p.w;x++) out.push([p.c+x,p.r+y]); return out; }
function occMap(placed, except){ const m={}; for(const id in placed){ if(id===except) continue; for(const c of cellsOf(placed[id])) m[key(c)]=id; } return m; }
function inRoom(cfg,c){ return c[0]>=0&&c[1]>=0&&c[0]<cfg.cols&&c[1]<cfg.rows; }
function frontSides(p){ const a=[],b=[];
  if(p.w>=p.h){ for(let x=0;x<p.w;x++){ a.push([p.c+x,p.r-1]); b.push([p.c+x,p.r+p.h]); } }
  else { for(let y=0;y<p.h;y++){ a.push([p.c-1,p.r+y]); b.push([p.c+p.w,p.r+y]); } }
  return [a,b]; }
function wallStyle(cfg, side, a, n){
  const P='var(--p)', X=`(100% - 2*${P})`;
  if(side==='left'||side==='right') return `${side}:0;width:${P};top:calc(${P} + ${X}*${a}/${cfg.rows});height:calc(${X}*${n}/${cfg.rows});writing-mode:vertical-rl`;
  return `${side}:0;height:${P};left:calc(${P} + ${X}*${a}/${cfg.cols});width:calc(${X}*${n}/${cfg.cols})`;
}
function lightStyle(cfg){ const w=cfg.window;
  if(w.side==='left') return `left:-12%;top:${(w.a-0.6)/cfg.rows*100}%;width:55%;height:${(w.n+1.2)/cfg.rows*100}%;background:radial-gradient(ellipse at left center,rgba(255,246,200,.9),transparent 70%)`;
  if(w.side==='bottom') return `bottom:-14%;left:${(w.a-0.6)/cfg.cols*100}%;height:60%;width:${(w.n+1.2)/cfg.cols*100}%;background:radial-gradient(ellipse at center bottom,rgba(255,246,200,.9),transparent 70%)`;
  return '';
}
function swingSVG(cfg){
  const W=cfg.cols*100, H=cfg.rows*100, a=cfg.door.a;
  const arc = cfg.door.side==='bottom'
    ? `<path d="M${a*100} ${H} A200 200 0 0 1 ${(a+2)*100} ${H-200}" fill="none" stroke="#C8463F" stroke-width="5" stroke-dasharray="12 9"/><line x1="${(a+2)*100}" y1="${H}" x2="${(a+2)*100}" y2="${H-200}" stroke="#8C5B36" stroke-width="12" stroke-linecap="round"/>`
    : `<path d="M${(a+2)*100} 0 A200 200 0 0 1 ${a*100} 200" fill="none" stroke="#C8463F" stroke-width="5" stroke-dasharray="12 9"/><line x1="${a*100}" y1="0" x2="${a*100}" y2="200" stroke="#8C5B36" stroke-width="12" stroke-linecap="round"/>`;
  return `<svg class="overlay" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${arc}</svg>`;
}
function roomHTML(cfg, placed, o={}){
  let cells='';
  for(let r=0;r<cfg.rows;r++) for(let c=0;c<cfg.cols;c++){
    const sw=!o.noSwing && cfg.SWING.some(s=>s[0]===c&&s[1]===r);
    cells+= o.onCell ? `<button class="cell${sw?' swing':''}${o.hit&&o.hit.has(c+','+r)?' hit':''}" aria-label="${r+1}행 ${c+1}열" onclick="${o.onCell}(${c},${r})"></button>`
                     : `<div class="cell${sw?' swing':''}"></div>`;
  }
  let pieces='';
  for(const id in placed){ const p=placed[id];
    pieces+=`<button class="piece${o.sel===id?' sel':''}${o.bad&&o.bad.has(id)?' bad':''}${o.fixed&&o.fixed.has(id)?' fixed':''}" style="left:${p.c/cfg.cols*100}%;top:${p.r/cfg.rows*100}%;width:${p.w/cfg.cols*100}%;height:${p.h/cfg.rows*100}%" onclick="${o.onPiece}('${id}')" aria-label="${FDEF[id].name}">${furnSVG(id,p.w,p.h)}</button>`;
  }
  return `<div class="roomwrap"><div class="floor" style="grid-template-columns:repeat(${cfg.cols},1fr);grid-template-rows:repeat(${cfg.rows},1fr);aspect-ratio:${cfg.cols}/${cfg.rows}">
     <div class="light" style="${lightStyle(cfg)}"></div>${cells}${swingSVG(cfg)}${pieces}</div>
    <div class="wallmark wm-win" style="${wallStyle(cfg,cfg.window.side,cfg.window.a,cfg.window.n)}">창문</div>
    <div class="wallmark wm-door" style="${wallStyle(cfg,cfg.door.side,cfg.door.a,2)}">문</div>
    <div class="wallmark wm-sw" style="${wallStyle(cfg,cfg.sw.side,cfg.sw.a,1)}">스위치</div>
    <div class="wallmark wm-out" style="${wallStyle(cfg,cfg.out.side,cfg.out.a,1)}">콘센트</div></div>`;
}

let m1 = null;

function m1View(){

  } else {

      ${showDefs||m1.answered?'':`<button class="btn sec small" onclick="m1Hint()">뜻 다시 보기 (연속 정답 0으로)</button>`}</div>
    ${showDefs?`<div class="defs">
      <div class="def a"><b>다목적 활용</b>하나의 공간을 여러 목적(용도)으로 쓰기</div>

      ${m1.i<2&&!m1.hint?'<p class="muted" style="font-size:.9rem">※ 뜻은 2번 카드까지만 보여요. 그다음부터는 스스로!</p>':''}`:''}
    <div class="scard">${SC[c.k]}<div class="txt">${m1.i+1}. ${c.t}</div></div>

}
function m1Hint(){ m1.hint=true; m1.combo=0; render(); }
function m1Ans(a){ if(m1.answered) return; m1.answered=a; if(a===m1.order[m1.i].a){ m1.correct++; m1.combo++; m1.best=Math.max(m1.best,m1.combo);} else m1.combo=0; render(); }
function m1Next(){
  if(m1.i < m1.order.length-1){ m1.i++; m1.answered=null; m1.hint=false; render(); window.scrollTo(0,0); return; }
  const n = m1.correct, st = n>=8?3:n>=6?2:1;
  S.m[1] = {score:n, total:m1.order.length, stars:st}; save();
  showDone(1, `${m1.order.length}장 중 <b>${n}장</b> 정답 · 최고 연속 정답 <b>${m1.best}</b>`, st, '같은 크기의 공간도 <b>다목적</b>·<b>입체적</b>으로 활용하면 활용도가 높아져요.');
}

/* ================= 미션 2 : 가구 배치 퍼즐 ================= */
const RULES = [
 {id:'light', t:'채광, 통풍 등에 방해가 되지 않도록 배치한다.', hint:'키 큰 가구(옷장·책장)가 창문 앞을 막고 있어요.'},
 {id:'plug',  t:'콘센트나 스위치를 가리지 않도록 배치한다.', hint:'콘센트나 스위치 앞에 가구가 있어요.'},
 {id:'order', t:'필수적이고 부피가 큰 가구부터 우선 배치한다.', hint:''},
 {id:'door',  t:'문의 위치와 너비 및 방향을 고려하여 배치한다.', hint:'문이 열리는 자리(분홍 칸)에 가구가 있어요.'},
 {id:'size',  t:'가구의 높이와 너비, 깊이를 고려하여 배치한다.', hint:'옷장 문을 열거나 책상 의자를 뺄 앞쪽 한 줄이 비어 있어야 해요.'},
 {id:'path',  t:'동선을 방해하지 않도록 배치한다.', hint:'문에서 걸어가 닿을 수 없는 가구가 있어요. (모든 가구 옆, 옷장·책상 앞까지 길이 있어야 해요)'}
];
let m2 = null;
function m2Start(challenge){ m2 = {cfg:challenge?ROOM2:ROOM1, challenge:!!challenge, placed:{}, sel:null, selFrom:null, rot:false, mistakes:0, orderMiss:0, checks:0, result:null, done:false}; go('m2'); }
function m2Pick(id){
  if(m2.done) return;
  if(m2.placed[id]){ m2.sel = m2.sel===id?null:id; m2.selFrom='board'; render(); return; }
  const d=FDEF[id];
  if(!d.big && m2.cfg.furn.some(f=>FDEF[f].big && !m2.placed[f])){
    m2.orderMiss++; m2.mistakes++;
    modal(`${say('잠깐! 교과서 97쪽을 떠올려 봐.<br><b>어떤 가구부터</b> 놓아야 할까?')}<p class="muted" style="margin-top:8px">「필수적이고 부피가 큰 가구부터 우선 배치한다.」 — 침대와 옷장을 먼저 놓아 보세요.</p><button class="btn" style="margin-top:12px;width:100%" onclick="closeModal()">알겠어요! 큰 가구부터 놓을게요</button>`);
    return;
  }
  m2.sel = (m2.sel===id && m2.selFrom==='tray') ? null : id;
  m2.selFrom='tray'; m2.rot=false; render();
  if(m2.sel) toast(`${d.name}${eul(d.name)} 놓을 칸을 눌러요. 누른 칸이 가구의 왼쪽 위 모서리가 돼요.`);
}
function m2Rotate(){
  if(!m2.sel) return; const id=m2.sel, cfg=m2.cfg;
  if(m2.placed[id]){
    const p=m2.placed[id]; const np={c:p.c,r:p.r,w:p.h,h:p.w};
    if(np.c+np.w>cfg.cols) np.c=cfg.cols-np.w; if(np.r+np.h>cfg.rows) np.r=cfg.rows-np.h;
    if(np.c<0||np.r<0){ toast('이 방에서는 그 방향으로 돌릴 수 없어요.'); return; }
    const occ=occMap(m2.placed,id);
    if(cellsOf(np).some(c=>occ[key(c)])){ toast('돌리면 다른 가구와 겹쳐요. 빈 곳으로 옮긴 뒤 돌려 보세요.'); return; }
    m2.placed[id]=np;
  } else { m2.rot=!m2.rot; toast(m2.rot?'가로·세로를 바꿨어요. 이제 칸을 눌러요.':'원래 방향으로 돌렸어요.'); }
  m2.result=null; render();
}
function m2Remove(){ if(m2.sel && m2.placed[m2.sel]){ delete m2.placed[m2.sel]; m2.sel=null; m2.result=null; render(); } }
function m2Cell(c,r){
  if(m2.done) return; const cfg=m2.cfg;
  const occ=occMap(m2.placed,m2.sel);
  if(!m2.sel){ if(occ[c+','+r]) m2Pick(occ[c+','+r]); else toast('오른쪽에서 가구를 먼저 골라요.'); return; }
  const d=FDEF[m2.sel]; const cur=m2.placed[m2.sel];
  let w,h; if(cur){w=cur.w;h=cur.h;} else { w=m2.rot?d.h:d.w; h=m2.rot?d.w:d.h; }
  if(w>cfg.cols||h>cfg.rows){ toast('이 방향으로는 방에 들어가지 않아요. 돌려 보세요.'); return; }
  const p={c:Math.min(c,cfg.cols-w), r:Math.min(r,cfg.rows-h), w, h};
  if(cellsOf(p).some(x=>occ[key(x)])){
    if(occ[c+','+r] && cur){ m2.sel=occ[c+','+r]; m2.selFrom='board'; render(); return; }
    toast('다른 가구와 겹쳐요. 다른 칸을 눌러 보세요.'); return;
  }
  m2.placed[m2.sel]=p; m2.sel=null; m2.result=null; render();
}
function evaluateRoom(cfg, placed){
  const occ=occMap(placed,null); const res={}, bad={};
  const mark=(rule,id)=>{ (bad[rule]=bad[rule]||new Set()).add(id); };
  res.light=true; for(const id in placed){ if(!FDEF[id].tall) continue; if(cellsOf(placed[id]).some(c=>cfg.WIN.some(w=>key(w)===key(c)))){res.light=false;mark('light',id);} }
  res.plug=true; for(const t of [cfg.OUT,cfg.SW]){ const id=occ[key(t)]; if(id){res.plug=false;mark('plug',id);} }
  res.order=true;
  res.door=true; for(const s of cfg.SWING){ const id=occ[key(s)]; if(id){res.door=false;mark('door',id);} }
  res.size=true; const fronts={};
  for(const id in placed){ if(!FDEF[id].front) continue;
    const sides=frontSides(placed[id]).filter(sd=>sd.every(c=>inRoom(cfg,c)&&!occ[key(c)]));
    if(!sides.length){res.size=false;mark('size',id);} else fronts[id]=sides; }
  const seen=new Set(); const q=[];
  for(const s of cfg.SWING) if(!occ[key(s)]){ seen.add(key(s)); q.push(s); }
  while(q.length){ const [x,y]=q.shift(); for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const n=[x+dx,y+dy]; if(inRoom(cfg,n)&&!occ[key(n)]&&!seen.has(key(n))){ seen.add(key(n)); q.push(n);} } }
  res.path=true;
  for(const id in placed){ const p=placed[id]; let ok=false;
    if(fronts[id]) ok = fronts[id].some(sd=>sd.some(c=>seen.has(key(c))));
    else for(const c of cellsOf(p)) for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ if(seen.has(key([c[0]+dx,c[1]+dy]))) ok=true; }
    if(!ok){res.path=false;mark('path',id);} }
  return {res, bad};
}
function m2Check(){
  if(m2.cfg.furn.some(f=>!m2.placed[f])){ toast(`가구 ${m2.cfg.furn.length}개를 모두 방에 놓은 뒤 검사해요.`); return; }
  m2.sel=null; m2.checks++;
  const r=evaluateRoom(m2.cfg,m2.placed); m2.result=r;
  const pass = RULES.every(x=>r.res[x.id]);
  if(!pass) m2.mistakes++;
  render();
  if(!pass) return;
  m2.done=true;
  if(m2.challenge){
    S.challenge=true; save();
    setTimeout(()=>modal(`<div style="text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center"><img src="${BOGEUM}" alt="" style="width:110px"><h2>도전 방 성공!</h2><p>좁은 방에 가구 5개를 모두 알맞게 놓았어요. <b>배치 고수 배지</b>를 얻었어요!</p><button class="btn" onclick="go('home')">미션 목록으로</button></div>`),900);

}

  if(!S.boss) { S.boss={start:Date.now(), mistakes:0}; save(); }
  m4={stage:'find', placed:JSON.parse(JSON.stringify(BOSS_START)), shelf:JSON.parse(JSON.stringify(BOSS_SHELF_START)), fixed:new Set(), item:null, wrongItems:new Set(), wrongTerm:new Set()};
  go('m4');
}
function miss(){ S.boss.mistakes++; save(); }
function m4Progress(){ if(m4.stage==='done') return 100; let p=40+m4.fixed.size*10; if(m4.stage==='term') p+=5; return p; }
function m4Piece(id){
  if(m4.stage!=='find') return;
  if(m4.fixed.has(id)){ toast('이미 고쳤어요!'); return; }
  const f=BOSS_ROOM[id];
  if(f.ok){ miss(); render(); toast(`${f.ok} (실수 +1)`, 3400); return; }
  m4Pending={type:'room', id, f, wrong:new Set()}; m4RuleRender();
}
function m4RuleRender(msg, ok){
  const P=m4Pending;
  modal(`<p class="muted">${FDEF[P.id].name}${P.id==='drawer'?' — 침대 옆에 두는 작은 서랍장':''}</p><h2 style="font-size:1.3rem">이 ${FDEF[P.id].name}${eun(FDEF[P.id].name)} 교과서 97쪽 배치 방법 중 <b>무엇을 어겼을까?</b></h2>
   <div class="opts">${RULES.map((r,j)=>`<button class="opt${P.wrong.has(r.id)?' wrong':''}" ${P.wrong.has(r.id)?'disabled':''} onclick="m4Rule('${r.id}')">${j+1}. ${r.t}</button>`).join('')}</div>
   ${msg?`<div class="fb ${ok?'ok':'no'}">${msg}</div>`:''}<button class="btn sec small" onclick="closeModal()">다른 곳 먼저 볼게요</button>`);
}
function m4Rule(rid){
  const P=m4Pending, f=P.f;
  if(rid===f.rule){
    m4.placed[P.id]=f.to; m4.fixed.add(P.id); closeModal(); m4After(f.done); return;
  }
  if(f.alt && rid===f.alt){ m4RuleRender(f.altMsg, true); return; }
  P.wrong.add(rid); miss(); m4RuleRender(`<b>아니에요.</b> 힌트: ${f.hint}`);
}
function m4Item(k){
  if(m4.stage!=='find') return;
  if(m4.fixed.has(k)){ toast('이미 고쳤어요!'); return; }
  const f=BOSS_SHELF[k];
  if(!f){ miss(); render(); toast(`${SHELF_OK[k]} (실수 +1)`, 3400); return; }
  m4Pending={type:'shelf', id:k, f, wrong:new Set()}; m4LvRender();
}
function m4LvRender(msg){
  const P=m4Pending, cur=m4.shelf.findIndex(l=>l.some(x=>x.k===P.id));
  modal(`<div class="row" style="flex-wrap:nowrap"><div style="width:72px;flex:none">${IT[P.id]}</div><h2 style="font-size:1.3rem">${ITEM_NAME[P.id]}, <b>어느 칸으로 옮길까?</b></h2></div>
   <div class="opts">${LEVELS.map((L,j)=>`<button class="opt${P.wrong.has(j)?' wrong':''}" ${P.wrong.has(j)||j===cur?'disabled':''} style="${j===cur?'opacity:.45':''}" onclick="m4Lv(${j})">${L.n}${j===cur?' (지금 자리)':''}</button>`).join('')}</div>
   ${msg?`<div class="fb no">${msg}</div>`:''}<button class="btn sec small" onclick="closeModal()">다른 곳 먼저 볼게요</button>`);
}
function m4Lv(j){
  const P=m4Pending;
  if(j===P.f.to){ const k=P.id; m4.shelf=m4.shelf.map(l=>l.filter(x=>x.k!==k)); m4.shelf[j].push({k}); m4.fixed.add(k); closeModal(); m4After(`${ITEM_NAME[k]}${eul(ITEM_NAME[k])} ${LEVELS[j].n}으로 옮겼어요. (${LEVELS[j].t})`); return; }
  P.wrong.add(j); miss(); m4LvRender(`<b>아니에요.</b> 힌트: ${P.f.hint}`);
}
function m4After(msg){
  if(m4.fixed.size>=BOSS_TOTAL) m4.stage='item';
  render(); toast(msg, 3200);
}
function m4PickItem(i){
  const it=BOSS_ITEMS[i];
  if(!it.ok){ m4.wrongItems.add(i); miss(); render(); toast(`${it.why} (실수 +1)`, 3200); return; }
  m4.item=i; m4.stage='term'; render();
}
const TERMS=[{id:'다',t:'공간의 다목적 활용'},{id:'구',t:'공간의 구역화'},{id:'입',t:'공간의 입체적 활용'}];
function m4Term(a){
  if(a!=='입'){ m4.wrongTerm.add(a); miss(); render(); toast(a==='구'?'구역화는 성격이 비슷한 공간끼리 묶는 것(지난 시간)이에요. (실수 +1)':'다목적 활용은 한 공간을 여러 용도로 쓰는 것이에요. (실수 +1)', 3400); return; }
  m4.stage='done';
  const end=Date.now();
  const score=Math.max(50,100-5*S.boss.mistakes);
  S.m[4]={score, mistakes:S.boss.mistakes, time:end-S.boss.start, item:BOSS_ITEMS[m4.item].t}; S.end=end; save();
  render();
  setTimeout(()=>go('report'),1300);
}
function m4View(){
  const prog=m4Progress();
  let lower='';
  if(m4.stage==='find'){
    lower = `<p class="disp" style="font-size:1.15rem">잘못된 곳 <b>${BOSS_TOTAL}군데</b>를 찾아 눌러요. (찾은 곳 ${m4.fixed.size} / ${BOSS_TOTAL})</p>
     <p class="muted" style="font-size:.93rem">방의 가구와 선반의 물건을 눌러 보세요. <b>잘 놓인 것을 누르거나 틀리게 고르면 실수 1번 (−5점)</b>. 수상해 보여도 괜찮은 것이 숨어 있어요!</p>`;
  } else if(m4.stage==='item'){
    lower = `${say('고마워! 그런데 상자 세 개가 아직 남았어. 바닥은 이제 꽉 찼고… <b>어떻게 하면 좋을까?</b>', true)}
     <div class="pick3">${BOSS_ITEMS.map((it,i)=>`<button class="${m4.wrongItems.has(i)?'wrong':''}" ${m4.wrongItems.has(i)?'disabled':''} onclick="m4PickItem(${i})">${SC[it.k]}${it.t}</button>`).join('')}</div>`;
  } else if(m4.stage==='term'){
    lower = `<div class="fb ok"><b>좋은 선택!</b> 「${BOSS_ITEMS[m4.item].t}」</div>
     <p class="disp" style="font-size:1.2rem;text-align:center">마지막 질문! 네가 고른 방법은 무엇일까?</p>
     <div class="opts">${TERMS.map(t=>`<button class="opt${m4.wrongTerm.has(t.id)?' wrong':''}" ${m4.wrongTerm.has(t.id)?'disabled':''} onclick="m4Term('${t.id}')">${t.t}</button>`).join('')}</div>`;
  } else {
    lower = `<div class="fb ok"><b>동생 방 구조 완료!</b> 리포트를 만들고 있어요…</div>`;
  }
  const shelf = `<div class="shelfwrap"><div class="shelf">${LEVELS.map((L,i)=>`<div class="lvl" style="min-height:80px"><span class="ln">${L.n}</span><span class="itemrow">${m4.shelf[i].map(x=>`<button class="${m4.fixed.has(x.k)?'fixed':''}" onclick="m4Item('${x.k}')" aria-label="${ITEM_NAME[x.k]}">${IT[x.k]}</button>`).join('')}</span></div>`).join('')}</div></div>`;
  return `${topbar('최종 보스 · 동생 방 구조대')}
  <div class="card">
    ${m4.stage==='find'?say('큰일이야! 내 동생 방이 엉망이래. 방 구조는 <b>내 방과 똑같아</b>. 오늘 배운 걸로 고쳐 줄래? <b>기회는 한 번뿐</b>이야!', true):''}
    <div><div class="row" style="justify-content:space-between"><span class="disp">방 상태</span><span class="disp">${prog}% · 실수 ${S.boss.mistakes}</span></div><div class="meter"><span style="width:${prog}%"></span></div></div>
    <div class="bossgrid">
      <div>${roomHTML(ROOM1, m4.placed, {fixed:m4.fixed, onPiece:'m4Piece', noSwing:true})}</div>
      <div><p class="disp" style="margin-bottom:6px">동생의 벽 선반</p>${shelf}</div>
    </div>
    ${lower}
  </div>`;
}

/* ================= 결과 ================= */
function showDone(n, line, st, lesson, extra){
  modal(`<div style="text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center">
    <img src="${BOGEUM}" alt="" style="width:110px"><h2>미션 ${n} 완료!</h2>
    <div style="font-size:2rem;color:#E0A100;letter-spacing:4px">${starStr(st)}</div>
    <p>${line}</p><div class="fb ok" style="text-align:left">${lesson}</div>
    <button class="btn" onclick="go('home')">미션 목록으로</button>${extra||''}</div>`);
}
function fmtTime(ms){ const s=Math.max(0,Math.round(ms/1000)); return `${Math.floor(s/60)}분 ${s%60}초`; }
function reportView(){
  const B=S.m[4];
  return `<div class="card report">
    <img src="${BOGEUM}" alt="" style="width:110px">
    <span class="tag">동생 방 구조 리포트</span>
    <p class="disp" style="font-size:1.3rem">${esc(S.who.cls)}반 ${esc(S.who.no)}번 ${esc(S.who.name)}</p>
    <div class="row" style="justify-content:center;gap:28px">
      <div><div class="big">${B.score}점</div><p class="muted">보스 점수 (실수 ${B.mistakes}번)</p></div>
      <div><div class="big" style="font-size:2.4rem;color:#2F7D5E">${fmtTime(B.time)}</div><p class="muted">보스 기록 시간</p></div>
    </div>
    <p class="muted" style="font-size:.92rem">베스트 문제왕: 점수가 높은 사람 → 같으면 보스 기록 시간이 짧은 사람</p>
    <table>
      <tr><td>미션 1 공간 마술 카드</td><td>${S.m[1]?starStr(S.m[1].stars):'-'}</td></tr>
      <tr><td>미션 2 가구 배치 퍼즐</td><td>${S.m[2]?starStr(S.m[2].stars):'-'}</td></tr>
      <tr><td>미션 3 정리왕 선반</td><td>${S.m[3]?(S.m[3].skipped?'건너뜀':starStr(S.m[3].stars)):'-'}</td></tr>
      <tr><td>도전 방</td><td>${S.challenge?'배치 고수 배지':'—'}</td></tr>
    </table>
    <div class="fb ok" style="text-align:left;max-width:540px">고친 것: 창문 앞 책장(채광·통풍) · 문 앞 협탁(문) · 스위치 가린 책상(콘센트·스위치) · 맨 위 공구함 → 맨 아래 · 맨 아래 교과서 → 셋째 칸<br>더 넓힌 방법: ${esc(B.item)} (입체적 활용)</div>
  </div>
  <div class="card">${say('이 화면을 선생님께 보여 줘! 그리고 <b>우리 집에서 바로 해 볼 한 가지</b>를 생각해 봐.', true)}
   <button class="btn sec" onclick="go('home')">미션 목록 보기</button></div>`;
}
/* ================= 시작 · 목록 ================= */
function introView(){
  return `<div class="card hero">
    <span class="tag">교과서 96~97쪽 · 주거 공간의 효율적 활용</span>
    <h1>보금이의 방 대변신</h1>
    <div class="heroart">${SC.loft}</div>
    ${say('작은 방으로 이사 왔어! 그런데 <b>크기와 구조가 같아도</b> 공간 활용·가구 배치·정리와 수납 방법에 따라 훨씬 넓게 쓸 수 있대. 도와줄래?')}
    <div class="fields">
      <label>반<input id="cls" inputmode="numeric" maxlength="2" placeholder="예: 3"></label>
      <label>번호<input id="no" inputmode="numeric" maxlength="2" placeholder="예: 12"></label>
      <label>이름<input id="nm" maxlength="10" placeholder="이름"></label>
    </div>
    <button class="btn" style="font-size:1.4rem;padding:14px 34px" onclick="enter()">시작하기</button>
    <button class="btn sec small" style="opacity:.6" onclick="teacher()">선생님</button>
  </div>`;
}
function enter(){
  const cls=$('#cls').value.trim(), no=$('#no').value.trim(), nm=$('#nm').value.trim();
  if(!cls||!no||!nm){ toast('반, 번호, 이름을 모두 적어요.'); return; }
  S=fresh(); S.who={cls,no,name:nm}; S.start=Date.now(); save(); go('home');
}
function homeView(){
  const M=[
    {n:1, cls:'m1', t:'공간 마술 카드', p:'다목적 활용? 입체적 활용? 카드 9장 · 연속 정답에 도전!', fn:'m1Start()'},
    {n:2, cls:'m2', t:'가구 배치 퍼즐', p:'가구 4개를 놓아 배치 방법 6가지를 모두 지켜요.', fn:'m2Start()'},
    {n:3, cls:'m3', t:'정리왕 선반', p:'설명을 읽고 물건 6개를 알맞은 칸에 정리해요.', fn:'m3Start()'},
    {n:4, cls:'m4', t:'최종 보스 · 동생 방 구조대', p:'엉망인 방에서 잘못된 곳 5군데를 찾아 고쳐요. 기회는 한 번!', fn:'m4Start()'}
  ];
  const unlocked=n=> n===1 || !!S.m[n-1];
  const cards=M.map(m=>{
    const done=!!S.m[m.n], lock=!unlocked(m.n);
    const st= done ? (m.n<4?(S.m[m.n].skipped?'건너뜀':starStr(S.m[m.n].stars)):`${S.m[4].score}점`) : '';
    const act = (m.n===4&&done) ? "go('report')" : m.fn;
    return `<button class="mission ${m.cls}${done?' done':''}${lock?' locked':''}" ${lock?'disabled':''} onclick="${act}">
      <span class="num">${m.n<4?'미션 '+m.n:'최종'}${lock?' · 앞 미션을 끝내면 열려요':''}</span><span class="mt">${m.t}</span><span class="mp">${m.p}</span><span class="stars">${st}</span></button>`;
  }).join('');
  const skip = (S.m[2] && !S.m[3]) ? `<button class="btn sec small" onclick="if(confirm('선생님이 허락했나요? 미션 3을 건너뛰면 미션 3 별은 0개예요.')){S.m[3]={score:0,total:6,stars:0,skipped:true};save();render();}">선생님이 허락하면: 미션 3 건너뛰고 최종 보스로</button>` : '';
  const ch = S.m[2] ? `<button class="btn warm small" onclick="m2Start(true)">${S.challenge?'도전 방 다시 하기 (배지 획득!)':'도전 방 · 먼저 끝낸 사람 (선택)'}</button>` : '';
  return `<div class="top"><h2>보금이의 방 대변신</h2><span class="who">${esc(S.who.cls)}반 ${esc(S.who.no)}번 ${esc(S.who.name)}</span></div>
   ${say(S.m[4]?'모두 완료! 리포트를 다시 보려면 최종 보스를 눌러.':'미션을 차례대로 해결해 줘. 끝낸 미션은 다시 도전할 수 있어(별은 새 기록으로 바뀌어).', true)}
   <div class="missions">${cards}</div>${(ch||skip)?`<div class="row">${ch}${skip}</div>`:''}
   <div style="text-align:right"><button class="btn sec small" style="opacity:.55" onclick="teacher()">선생님</button></div>`;
}
function teacher(){
  modal(`<h2>선생님 메뉴</h2><p>이 기기의 기록을 지우고 처음 화면으로 돌아갑니다. 초기화 코드를 입력하세요.</p>
   <input id="rc" inputmode="numeric" maxlength="6" placeholder="초기화 코드" style="margin-top:6px">
   <div class="row" style="margin-top:12px"><button class="btn warm" onclick="doReset()">초기화</button><button class="btn sec" onclick="closeModal()">취소</button></div>`);
}
function doReset(){ if(($('#rc')||{}).value===RESET_CODE){ try{localStorage.removeItem(KEY);}catch(e){} S=fresh(); closeModal(); go('intro'); toast('초기화했어요.'); } else toast('코드가 달라요.'); }
function modal(html){ closeModal(); const d=document.createElement('div'); d.className='modalbg'; d.id='modal'; d.innerHTML=`<div class="card modal">${html}</div>`; d.addEventListener('click',e=>{ if(e.target===d) closeModal(); }); document.body.appendChild(d); }
function closeModal(){ const m=$('#modal'); if(m) m.remove(); }
function render(){
  const app=$('#app');
  if(!S.who){ app.innerHTML=introView(); return; }
  if(view==='m1'&&m1) app.innerHTML=m1View();
  else if(view==='m2'&&m2) app.innerHTML=m2View();
  else if(view==='m3'&&m3) app.innerHTML=m3View();
  else if(view==='m4'&&m4) app.innerHTML=m4View();
  else if(view==='report'&&S.m[4]) app.innerHTML=reportView();
  else { view='home'; app.innerHTML=homeView(); }
}
render();
</script>
</body></html>
